<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Idle Kingdom</title>
		<meta name="bitmedia-site-verification" content="c69bc5160b163115dae898655c055fc8" />
		<style>
html, body {
	margin: 0;
	padding: 0;
	border: 0;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	height: 100%;
}

/* Reserva uma faixa fixa embaixo pro banner de anúncio DE VERDADE (fora
   do jogo) — o canvas do Godot ocupa o resto da tela, acima dela. Assim
   não precisa alinhar pixel a pixel com as coordenadas internas do jogo. */
#game-area {
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	bottom: var(--ad-banner-height, 0px);
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
	margin: 0;
	padding: 0;
	border: 0;
}

#canvas:focus {
	outline: none;
}

/* ---------- FAIXA DO BANNER DE ANÚNCIO (Adsterra) ---------- */
#ad-banner-slot {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	height: var(--ad-banner-height, 0px);
	background-color: #111;
	display: flex;
	align-items: center;
	justify-content: center;
	overflow: hidden;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<div id="game-area">
			<canvas id="canvas">
				Your browser does not support the canvas tag.
			</canvas>

			<noscript>
				Your browser does not support JavaScript.
			</noscript>

			<div id="status">
				<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
				<progress id="status-progress"></progress>
				<div id="status-notice"></div>
			</div>
		</div>

		<!-- ======================================================
		     ESPAÇO DO BANNER (Adsterra) — cole o código de "Banner"
		     da sua conta Adsterra aqui dentro. Assim que colar um
		     código de verdade, mude ADSTERRA_BANNER_CONFIGURED pra
		     true e ajuste --ad-banner-height (px) pro tamanho do
		     banner que a Adsterra te der (normalmente 50 ou 90px).
		     ====================================================== -->
		<div id="ad-banner-slot">
			<!-- COLE_AQUI_O_CODIGO_DE_BANNER_DA_ADSTERRA -->
		</div>

		<script>
			// Ajuste esse valor pro tamanho real do banner (0 = escondido,
			// sem banner nenhum reservando espaço — é o estado enquanto
			// não tiver um código de verdade colado acima).
			document.documentElement.style.setProperty('--ad-banner-height', '0px');

			// Flag central: true assim que houver um código de Banner real
			// colado acima. Controla se o jogo mostra o mock por baixo dele.
			window.ADSTERRA_BANNER_CONFIGURED = false;

			// URL de "Direct Link"/SmartLink da Adsterra pra anúncios sob
			// demanda (intersticial ao fechar telas, recompensado ao pedir
			// um boost). Troque pela sua URL real quando tiver uma.
			window.ADSTERRA_DIRECT_LINK_URL = "";

			// Chamado pelo jogo (via JavaScriptBridge) quando quer mostrar
			// um anúncio "sob demanda". Retorna true se conseguiu abrir um
			// anúncio de verdade; false faz o jogo cair pro popup de teste.
			window.showAdsterraOffer = function () {
				if (!window.ADSTERRA_DIRECT_LINK_URL) {
					return false;
				}
				window.open(window.ADSTERRA_DIRECT_LINK_URL, '_blank');
				return true;
			};
		</script>

		<!-- ======================================================
		     SOCIAL BAR (Adsterra) — cole o <script> de "Social Bar"
		     da sua conta aqui embaixo, antes do fechamento do body.
		     Esse formato roda sozinho (a Adsterra decide quando
		     mostrar, baseado nos cliques do jogador na página) —
		     não precisa chamar nada do jogo pra ele funcionar.
		     ====================================================== -->
		<!-- COLE_AQUI_O_CODIGO_DE_SOCIAL_BAR_DA_ADSTERRA -->

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":13152464,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
